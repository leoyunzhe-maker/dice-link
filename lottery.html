<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dice · Lucky Draw</title>
<style>
  :root { --bg:#0e0b16; --card:#181322; --line:#2b2438; --gold:#d4af37; --pink:#ff5d8f; --fg:#f4f1ea; --dim:#9a92a8; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,system-ui,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 20px 48px; }
  .wrap { width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px; }
  .eyebrow { color:var(--gold); font-size:12px; letter-spacing:3px; font-weight:700; }
  h1 { font-size:32px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); padding:18px; }
  .big { font-size:30px; font-weight:700; }
  .dim { color:var(--dim); font-size:14px; }
  .bar { height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin:10px 0 8px; }
  .bar i { display:block; height:100%; background:var(--gold); border-radius:5px; transition:width .4s; }
  .stage { min-height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .wheel { width:110px; height:110px; border-radius:50%; border:3px solid var(--gold);
           display:flex; align-items:center; justify-content:center; font-size:44px; }
  .spin { animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .result { font-size:22px; font-weight:700; text-align:center; }
  .prize { color:var(--pink); font-size:26px; font-weight:800; text-align:center; }
  button { width:100%; padding:16px; border:0; background:var(--gold); color:#0a0a0d;
           font-size:14px; font-weight:800; letter-spacing:2.5px; cursor:pointer; }
  button:disabled { background:var(--line); color:var(--dim); }
  .err { color:#ff8a8a; text-align:center; padding:24px 0; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="eyebrow">STAMP RALLY · 抽奖</div>
    <h1>Lucky Draw</h1>
  </div>
  <div id="err" class="err hidden"></div>
  <div class="card" id="progress" style="display:none">
    <div class="dim">集章进度 · Booths collected</div>
    <div class="big"><span id="done">0</span> / <span id="total">0</span></div>
    <div class="bar"><i id="fill" style="width:0%"></i></div>
    <div class="dim">剩余抽奖次数 · Draws left: <b id="left">0</b></div>
  </div>
  <div class="card stage" id="stage" style="display:none">
    <div class="wheel" id="wheel">🎁</div>
    <div id="outcome" class="hidden">
      <div class="result" id="resultText"></div>
      <div class="prize" id="prizeName"></div>
    </div>
  </div>
  <button id="drawBtn" style="display:none" onclick="draw()">抽奖 · DRAW</button>
  <div class="dim" style="text-align:center">集满一半摊位=1次 · ⅔=2次 · 全部=3次<br>中奖后请到工作人员处领取 · Show your win to staff to claim</div>
</div>
<script>
const CODE = new URLSearchParams(location.search).get('code') || '';
const BASE = 'https://noyyqwifmucfliumkcgt.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_jLnIwihvXh5-fhcbWUoj1w_bL7j7DzA';
const H = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };
const $ = id => document.getElementById(id);
let busy = false;

async function rpc(fn, args) {
  const r = await fetch(BASE + fn, { method: 'POST', headers: H, body: JSON.stringify(args) });
  return await r.json();
}
function render(s) {
  $('progress').style.display = 'block';
  $('stage').style.display = 'flex';
  $('drawBtn').style.display = 'block';
  $('done').textContent = s.collected; $('total').textContent = s.total;
  $('fill').style.width = (s.total ? Math.round(100 * s.collected / s.total) : 0) + '%';
  $('left').textContent = s.chances_left;
  $('drawBtn').disabled = s.chances_left <= 0;
  $('drawBtn').textContent = s.chances_left > 0 ? '抽奖 · DRAW' : (s.chances_total > 0 ? '次数已用完 · NO DRAWS LEFT' : '继续集章解锁抽奖 · COLLECT MORE STAMPS');
}
async function load() {
  if (!CODE) { $('err').textContent = '缺少卡号 · Missing card code'; $('err').classList.remove('hidden'); return; }
  const s = await rpc('card_status', { p_card_code: CODE });
  if (!s || s.ok === false) { $('err').textContent = '卡片无效 · Card not found'; $('err').classList.remove('hidden'); return; }
  render(s);
}
async function draw() {
  if (busy) return; busy = true;
  $('outcome').classList.add('hidden');
  $('wheel').classList.add('spin');
  $('drawBtn').disabled = true;
  const started = Date.now();
  const d = await rpc('draw_lottery', { p_card_code: CODE });
  setTimeout(async () => {
    $('wheel').classList.remove('spin');
    if (d && d.ok) {
      $('outcome').classList.remove('hidden');
      $('resultText').textContent = d.won ? '🎉 中奖了! · YOU WON!' : '差一点 · So close!';
      $('prizeName').textContent = d.won ? (d.prize_name || '') : '';
    }
    await load();
    busy = false;
  }, Math.max(0, 1200 - (Date.now() - started)));
}
load();
</script>
</body>
</html>
