<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dice × IEHO — Live Trivia</title>
<style>
  :root{
    --paper:#f3eee4; --face:#f8f4ec; --ink:#3b3126; --gold:#a9885b;
    --dim:#8b8272; --bad:#8a4a3a; --line:rgba(59,49,38,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:Georgia,'Times New Roman','Songti SC','SimSun',serif;
    min-height:100%; overflow-x:hidden;
  }
  /* --- Montréal street-map background layer --- */
  #bgmap{position:fixed;inset:-80px;z-index:0;pointer-events:none;opacity:.10;
    animation:mapdrift 80s ease-in-out infinite alternate}
  #bgmap svg{width:100%;height:100%}
  @keyframes mapdrift{from{transform:translate(0,0)}to{transform:translate(-46px,-30px)}}
  #bgvig{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 120% 90% at 50% 40%, rgba(0,0,0,0) 55%, rgba(74,62,46,.16) 100%)}
  .wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:28px 22px 60px;
    min-height:100vh;display:flex;flex-direction:column}
  .kicker{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:12px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--ink);font-weight:600}
  .kicker .g{color:var(--gold)}
  .rule{width:72px;height:2px;background:var(--gold);margin:16px 0}
  h1.big{font-size:58px;line-height:1.02;font-weight:700;letter-spacing:-.01em}
  .tag{font-style:italic;color:var(--dim);font-size:18px;margin-top:10px;line-height:1.5}
  .label{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--dim);font-weight:600}
  .card{background:var(--face);border:1px solid var(--line);border-radius:18px;padding:22px}
  input[type=text]{
    width:100%;background:transparent;border:0;border-bottom:2px solid var(--ink);
    font-family:inherit;font-size:24px;color:var(--ink);padding:10px 2px;outline:none;border-radius:0;
  }
  input[type=text]::placeholder{color:#b6ac99;font-style:italic}
  .btn{
    display:block;width:100%;margin-top:22px;padding:17px;border:0;border-radius:14px;cursor:pointer;
    background:var(--ink);color:var(--paper);font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;
    font-size:14px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
  }
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .btn.pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(169,136,91,.45)}
    50%{transform:scale(1.02);box-shadow:0 0 0 12px rgba(169,136,91,0)}}
  .hidden{display:none!important}
  /* hero die animation */
  .hero{position:relative}
  .heroDie{position:absolute;right:6px;top:-6px;width:92px;height:92px;animation:tumble 7s ease-in-out infinite}
  .heroDie .dface{width:100%;height:100%;background:var(--face);border:2px solid var(--ink);border-radius:22px;
    position:relative;box-shadow:0 10px 18px rgba(59,49,38,.14)}
  .heroDie i{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--ink)}
  .heroDie i.g{background:var(--gold)}
  @keyframes tumble{0%,100%{transform:rotate(-9deg) translateY(0)}25%{transform:rotate(4deg) translateY(-7px)}
    50%{transform:rotate(11deg) translateY(2px)}75%{transform:rotate(-3deg) translateY(-5px)}}
  /* rotating tagline */
  .tagswap{position:relative;min-height:56px}
  .tagswap .tag{position:absolute;left:0;right:0;top:0;opacity:0;transition:opacity .9s;margin-top:10px}
  .tagswap .tag.on{opacity:1}
  /* language chips */
  .langrow{display:flex;gap:10px;margin-bottom:18px}
  .chip{
    flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;cursor:pointer;
    font-family:inherit;font-size:17px;color:var(--dim);text-align:center;
  }
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  /* how-to steps */
  .step{display:flex;gap:14px;margin-top:14px;align-items:baseline}
  .step .n{font-style:italic;color:var(--gold);font-size:19px;min-width:30px}
  .step div p{color:var(--dim);font-size:14.5px;line-height:1.55;margin-top:2px}
  .step div b{font-size:16.5px}
  /* quiz */
  .qtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .qnum{font-style:italic;color:var(--gold);font-size:22px}
  .timerline{height:3px;background:rgba(59,49,38,.16);border-radius:2px;overflow:hidden;margin:14px 0 26px}
  .timerline i{display:block;height:100%;background:var(--gold);width:100%}
  .qcn{font-size:26px;line-height:1.35;font-weight:700}
  .opts{margin-top:26px;display:grid;gap:12px}
  .opt{
    text-align:left;background:var(--face);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;font-family:inherit;font-size:18px;color:var(--ink);cursor:pointer;line-height:1.35;
    display:flex;gap:12px;align-items:baseline;
  }
  .opt .idx{font-style:italic;color:var(--gold);font-size:15px;min-width:20px}
  .opt.correct{background:var(--gold);border-color:var(--gold);color:#fff}
  .opt.correct .idx{color:#fff}
  .opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.wrong .idx{color:#fff}
  .opt.dis{opacity:.45}
  .fact{margin-top:20px;padding:14px 16px;border-left:3px solid var(--gold);color:var(--dim);
    font-size:15px;line-height:1.55;font-style:italic}
  .scorepill{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:12px;
    letter-spacing:.18em;color:var(--dim);font-weight:600}
  /* interstitial */
  .inter{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
  .inter h2{font-size:50px;line-height:1.05}
  /* results — rank hero */
  .rankwrap{text-align:center;margin-top:34px}
  .rankhero{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:10px}
  .rankhero .no{font-style:italic;font-size:44px;color:var(--gold)}
  .rankhero .num{font-size:150px;line-height:.95;font-weight:700;color:var(--gold);
    text-shadow:0 2px 0 rgba(59,49,38,.18)}
  .tier{font-size:23px;margin-top:14px;font-weight:700}
  .oftotal{color:var(--dim);font-style:italic;font-size:16px;margin-top:6px}
  .scoreline{margin-top:18px;font-size:19px}
  .flour{display:flex;align-items:center;gap:14px;justify-content:center;margin-top:26px;color:var(--gold)}
  .flour::before,.flour::after{content:'';height:1px;width:70px;background:var(--gold);display:block}
  table.lb{width:100%;border-collapse:collapse;margin-top:14px}
  table.lb td{padding:12px 6px;border-bottom:1px solid rgba(59,49,38,.15);font-size:19px}
  table.lb td.r{font-style:italic;color:var(--gold);width:44px;font-size:20px}
  table.lb td.s{text-align:right;font-variant-numeric:tabular-nums}
  table.lb tr.top3 td{font-weight:700}
  table.lb tr.me td{background:rgba(169,136,91,.14)}
  .divider{height:1px;background:var(--line);margin:36px 0 28px;position:relative}
  .divider::after{content:'◆';position:absolute;left:50%;top:-9px;transform:translateX(-50%);
    color:var(--gold);font-size:11px;background:var(--paper);padding:0 10px}
  .feat{display:flex;gap:14px;margin-top:18px;align-items:baseline}
  .feat .n{font-style:italic;color:var(--gold);font-size:19px;min-width:34px}
  .feat b{font-size:18px}
  .feat p{color:var(--dim);font-size:14.5px;margin-top:3px;line-height:1.5}
  .qrrow{display:flex;gap:20px;align-items:center;margin-top:26px}
  .qrbox{width:140px;height:140px;flex:0 0 140px;border:1px solid var(--line);border-radius:14px;
    background:#fff;padding:10px}
  .qrbox svg{width:100%;height:100%;display:block}
  .vfoot{margin-top:auto;padding-top:36px;text-align:center}
  .vfoot span{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:10px;
    letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
  @media (max-width:420px){ h1.big{font-size:48px} .qcn{font-size:22px} .rankhero .num{font-size:120px}
    .heroDie{width:74px;height:74px;right:0} }
</style>
</head>
<body>

<div id="bgmap"></div>
<div id="bgvig"></div>

<!-- ============ INTERSTITIAL ============ -->
<div class="wrap hidden" id="scrInter">
  <div class="inter">
    <div class="kicker" id="interKicker"></div>
    <h2 id="interTitle" style="margin-top:18px"></h2>
    <div class="rule"></div>
    <div class="tag" id="interSub"></div>
  </div>
</div>

<!-- ============ QUIZ ============ -->
<div class="wrap hidden" id="scrQuiz">
  <div class="qtop">
    <div class="kicker" id="qPart"></div>
    <div class="scorepill" id="qScore">SCORE 0</div>
  </div>
  <div class="qtop">
    <div class="qnum" id="qNum">01 / 14</div>
    <div class="scorepill" id="qTime">15s</div>
  </div>
  <div class="timerline"><i id="qBar"></i></div>
  <div class="qcn" id="qCn"></div>
  <div class="opts" id="qOpts"></div>
  <div class="fact hidden" id="qFact"></div>
  <button class="btn hidden" id="btnNext"></button>
</div>

<!-- ============ RESULTS ============ -->
<div class="wrap hidden" id="scrResult">
  <div class="kicker" id="rKicker"></div>

  <div class="rankwrap">
    <div class="label" id="rRankLabel"></div>
    <div class="rankhero"><span class="no">N°</span><span class="num" id="rRankNum">–</span></div>
    <div class="tier" id="rTier"></div>
    <div class="oftotal" id="rOfTotal"></div>
    <div class="scoreline"><span id="rScoreLine"></span></div>
    <div class="flour">◆</div>
  </div>

  <div style="margin-top:26px">
    <div class="label" id="rBoardLabel"></div>
    <table class="lb" id="rBoard"></table>
  </div>

  <div class="divider"></div>

  <div class="kicker" id="rAboutKicker"></div>
  <h1 class="big" style="font-size:48px;margin-top:12px">Dice,</h1>
  <div class="tag" id="rAboutPitch"></div>

(function drawMap(){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  const W = 1200, H = 1600;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  function line(x1,y1,x2,y2,w,c,dash){
    const l = document.createElementNS(NS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',c); l.setAttribute('stroke-width',w);
    if(dash) l.setAttribute('stroke-dasharray',dash);
    svg.appendChild(l);
  }
  // Montréal's tilted street grid (~30°)
  const a = Math.PI/6, dx = Math.cos(a), dy = Math.sin(a);
  for(let i=-20;i<40;i++){ // rues (NE-SW)
    const off = i*72;
    line(off - H*dy, 0 - 0, off + H*dy*2, H*3*dx*0 + H, i%4===0 ? 2.2 : 1, '#3b3126');
  }
  for(let i=-10;i<30;i++){ // avenues (NW-SE), perpendicular-ish
    const off = i*88;
    line(0, off + 0, W, off - W*0.58, i%3===0 ? 2.2 : 1, '#3b3126');
  }
  // boulevards (gold): St-Laurent / Sherbrooke feel

  line(-40, H*0.46, W+40, H*0.20, 4, '#a9885b');
  // metro line (dashed gold)
  line(-40, H*0.62, W+40, H*0.40, 3, '#a9885b', '14 10');
  // St. Lawrence river — wide band bottom right

    ' L '+(W+40)+' '+(H+40)+' L -40 '+(H+40)+' Z');
  river.setAttribute('fill','#a9885b'); river.setAttribute('opacity','0.55');
  svg.appendChild(river);
  // Mont Royal — park blob + cross, upper left

  park.setAttribute('fill','none'); park.setAttribute('stroke','#3b3126'); park.setAttribute('stroke-width','2.5');
  svg.appendChild(park);
  line(W*0.16, H*0.16-46, W*0.16, H*0.16+10, 5, '#a9885b');
  line(W*0.16-20, H*0.16-28, W*0.16+20, H*0.16-28, 5, '#a9885b');
  document.getElementById('bgmap').appendChild(svg);
})();

// ------------------------------ state ------------------------------
const $ = id => document.getElementById(id);
const TIME = 15;
let user = '', qi = 0, score = 0, timer = null, t0 = 0, locked = false;

function t(){ return T[L]; }

// rotating taglines
let tagIdx = 0, tagTimer = null;
function buildTags(){
  const box = $('wTags'); box.innerHTML = '';
  t().tags.forEach((s,i) => {
    const d = document.createElement('div');
    d.className = 'tag' + (i===0 ? ' on' : '');
    d.textContent = s;
    box.appendChild(d);
  });
  tagIdx = 0;
  clearInterval(tagTimer);
  tagTimer = setInterval(() => {
    const kids = [...$('wTags').children];
    if(!kids.length) return;
    kids[tagIdx].classList.remove('on');
    tagIdx = (tagIdx+1) % kids.length;
    kids[tagIdx].classList.add('on');
  }, 3800);
}

function applyLang(){
  document.documentElement.lang = L;
  $('chipZh').classList.toggle('on', L==='zh');
  $('chipEn').classList.toggle('on', L==='en');
  buildTags();
  $('wLangLabel').textContent = t().langLabel;
  $('wNameLabel').textContent = t().nameLabel + (L==='zh' ? ' · Your name' : '');
  $('uname').placeholder = t().nameHint;
  $('btnStart').textContent = t().start;
  $('wHowLabel').textContent = t().howLabel;
  $('h1b').textContent = t().h1b; $('h1p').textContent = t().h1p;
  $('h2b').textContent = t().h2b; $('h2p').textContent = t().h2p;
  $('h3b').textContent = t().h3b; $('h3p').textContent = t().h3p;
  $('wWhatLabel').textContent = t().whatLabel;
  $('wPitch').textContent = t().pitch;
  $('wQrTxt').innerHTML = t().qrTxt;
}
$('chipZh').onclick = () => { L='zh'; applyLang(); };
$('chipEn').onclick = () => { L='en'; applyLang(); };
applyLang();

function show(id){
  ['scrWelcome','scrInter','scrQuiz','scrResult'].forEach(s => $(s).classList.add('hidden'));
  $(id).classList.remove('hidden');
  window.scrollTo(0,0);
}

// ------- idle: back to welcome after 60s without touch -------
let idleT = null;
function armIdle(){
  clearTimeout(idleT);
  idleT = setTimeout(() => {
    if($('scrWelcome').classList.contains('hidden')) resetToWelcome();
    armIdle();
  }, 60000);
}
['pointerdown','keydown','touchstart'].forEach(ev =>
  document.addEventListener(ev, armIdle, {passive:true}));
armIdle();

function resetToWelcome(){
  cancelAnimationFrame(timer);
  locked = true;
  $('uname').value = '';
  show('scrWelcome');
}

$('btnStart').onclick = () => {
  const v = $('uname').value.trim();
  if(!v){ $('uname').focus(); return; }
  user = v; qi = 0; score = 0;
  interstitial(1, () => renderQ());
};

function interstitial(part, next){
  $('interKicker').textContent = part===1 ? t().p1Kicker : t().p2Kicker;
  $('interTitle').textContent = part===1 ? t().p1Title : t().p2Title;
  $('interSub').textContent = part===1 ? t().p1Sub : t().p2Sub;
  show('scrInter');
  setTimeout(next, 1600);
}

function renderQ(){
  if(!$('scrWelcome').classList.contains('hidden')) return; // idle reset happened
  const q = QUESTIONS[qi], loc = q[L];
  locked = false;
  $('qPart').textContent = q.part === 1 ? t().qPart1 : t().qPart2;
  $('qScore').textContent = 'SCORE ' + score;
  $('qNum').textContent = String(qi+1).padStart(2,'0') + ' / ' + QUESTIONS.length;
  $('qCn').textContent = loc.q;
  $('qFact').classList.add('hidden');
  $('btnNext').classList.add('hidden');
  const box = $('qOpts'); box.innerHTML = '';
  const order = loc.opts.map((_,i)=>i).sort(()=>Math.random()-.5);
  order.forEach((oi, slot) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="idx">' + ['a','b','c','d'][slot] + '.</span><span>' + loc.opts[oi] + '</span>';
    b.onclick = () => pick(b, oi === q.ans, order, q);
    box.appendChild(b);
  });
  show('scrQuiz');
  startTimer(q, order);
}

function startTimer(q, order){
  t0 = performance.now();
  cancelAnimationFrame(timer);
  const tick = () => {
    if($('scrQuiz').classList.contains('hidden')) return;
    const left = Math.max(0, TIME - (performance.now() - t0)/1000);
    $('qBar').style.width = (left/TIME*100) + '%';
    $('qTime').textContent = Math.ceil(left) + 's';
    if(left <= 0){ if(!locked) pick(null, false, order, q); return; }
    timer = requestAnimationFrame(tick);
  };
  tick();
}

function pick(btn, correct, order, q){
  if(locked) return;
  locked = true;
  cancelAnimationFrame(timer);
  const left = Math.max(0, TIME - (performance.now() - t0)/1000);
  let gained = 0;
  if(correct) gained = 100 + Math.round(100 * left / TIME);
  score += gained;
  const kids = [...$('qOpts').children];
  kids.forEach((k, slot) => {
    const oi = order[slot];
    if(oi === q.ans) k.classList.add('correct');
    else if(k === btn) k.classList.add('wrong');
    else k.classList.add('dis');
    k.onclick = null;
  });
  $('qScore').textContent = 'SCORE ' + score;
  const lead = correct ? ('+' + gained + t().correct) : (btn ? t().wrong : t().timeout);
  $('qFact').textContent = lead + ' · ' + q[L].fact;
  $('qFact').classList.remove('hidden');
  $('btnNext').textContent = qi === QUESTIONS.length - 1 ? t().results : t().next;
  $('btnNext').classList.remove('hidden');
}

$('btnNext').onclick = () => {
  qi++;
  if(qi >= QUESTIONS.length){ finish(); return; }
  if(QUESTIONS[qi].part === 2 && QUESTIONS[qi-1].part === 1){
    interstitial(2, () => renderQ());
  } else renderQ();
};

// ------------------------------ results (local leaderboard) ------------------------------
function tierText(rank){
  if(rank === 1) return t().tier1;
  if(rank <= 3) return t().tier3;
  if(rank <= 10) return t().tier10;
  return t().tierElse;
}

function finish(){
  $('rKicker').textContent = t().rKicker;
  $('rRankLabel').textContent = t().rankLabel;
  $('rBoardLabel').textContent = t().boardLabel;
  $('rAboutKicker').textContent = t().aboutKicker;
  $('rAboutPitch').textContent = t().aboutPitch;
  $('rQrLabel').textContent = t().qrLabel;
  $('rQrTxt').innerHTML = t().qrTxt2;
  $('btnAgain').textContent = t().again;
  const fx = $('rFeats'); fx.innerHTML = '';
  t().feats.forEach((f,i) => {
    const d = document.createElement('div');
    d.className = 'feat';
    d.innerHTML = '<div class="n">' + String(i+1).padStart(2,'0') + '</div><div><b>' + f[0] + '</b><p>' + f[1] + '</p></div>';
    fx.appendChild(d);
  });
  const key = 'dice_quiz_lb';
  const arr = JSON.parse(localStorage.getItem(key) || '[]');
  const entry = {name:user, score:score, ts:Date.now()};
  arr.push(entry);
  arr.sort((a,b)=>b.score-a.score || (a.ts||0)-(b.ts||0));
  localStorage.setItem(key, JSON.stringify(arr.slice(0,200)));
  const rank = arr.indexOf(entry) + 1;
  $('rRankNum').textContent = rank;
  $('rTier').textContent = tierText(rank);
  $('rOfTotal').textContent = t().ofTotal(arr.length);
  $('rScoreLine').textContent = t().scoreLine(user, score);
  renderBoard(arr.slice(0,10), entry);
  show('scrResult');
}

function renderBoard(top, entry){
  const tb = $('rBoard'); tb.innerHTML = '';
  const medals = ['👑','🥈','🥉'];
  top.forEach((e,i) => {
    const tr = document.createElement('tr');
    if(i < 3) tr.className = 'top3';
    if(e === entry) tr.className += ' me';
    const m = i < 3 ? ' ' + medals[i] : '';
    tr.innerHTML = '<td class="r">' + String(i+1).padStart(2,'0') + '</td><td>' + esc(e.name) + m + '</td><td class="s">' + e.score + '</td>';
    tb.appendChild(tr);
  });
}
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

$('btnAgain').onclick = () => { $('uname').value=''; show('scrWelcome'); };
</script>
